[package]
name = "code_glibc_fixer"
version = "0.1.0"
edition = "2021"
description = "Fix VSCode Server glibc version issues on systems with old glibc (e.g. tlinux2/glibc-2.17)"
rust-version = "1.70"

[[bin]]
name = "code_glibc_fixer"
path = "src/main.rs"

[dependencies]
# clap 4.4.x has MSRV 1.70, compatible with rustc 1.72.1
# clap 4.5.x bumped MSRV to 1.74 - do not upgrade beyond 4.4
clap = { version = "=4.4.18", features = ["derive"] }
anyhow = "1"
inotify = "0.10"
